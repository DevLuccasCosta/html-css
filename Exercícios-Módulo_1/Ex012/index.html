<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
   <h1>Inserindo vídeos hospedados localmente</h1>
   <p>Este vídeo está hospeda no meu próprio servidor.</p> 

   <video width="560" height="350" ="imagens/minha-foto.jpg" controls autoplay loop>
    <source src="mídia/meu-video.mp4" type="video/mp4">
    <source src="mídia/Meu-Video.mkv" type="video/mkv">
    <source src="mídia/Meu-Video.webm" type="video/webm">
    <source src="mídia/meu-video.ogg" type="video/ogg">
   </video>
   <p>Seu navegador não tem compatibílidade com reprodução de vídeos.</p>

   <h1>Inserindo vídeos do YouTube</h1>
  <iframe width="560" height="315" src="https://www.youtube.com/embed/_1VzoOpEXxs?si=41cZc-o-z1memnyK" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
   
  <h1>Inserindo vídeos do Vímeo</h1>
   <iframe title="vimeo-player" src="https://player.vimeo.com/video/140561159?h=a0c2e2f789" width="640" height="360" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"   allowfullscreen></iframe>
   
</body>
</html>
