<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual a tag deverá utilizar em cada caso.</p>
    <ul type="disc">
        <li><a href="" title="use a tag &lt;p&gt;">Parágrafo</a></li>
        <li><a href="" title="use a tag &lt;h1&gt; até &lt;h6&gt;">Títulos</a></li>
        <li><a href="" title="use a tag &lt;img&gt;">Imagem</a></li>
        <li><a href="" title="use a tag &lt;abbr&gt;">Abreviação</a></li>
        <li><a href="" title="use a tag &lt;ol&gt; e &lt;li&gt;">Listas númeradas</a></li>
        <li><a href="" title="use a tag &lt;ul&gt; e &lt;li&gt;">Listas com demarcadores</a></li>
        <li><a href="" title="use a tag &lt;code&gt;">Código fonte</a></li>
    </ul>
